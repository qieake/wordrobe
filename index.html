<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fcfaf5" />
  <title>我的每日衣柜</title>
  <style>
    /* Ins 风暖色渐变背景 */
    :root {
      --bg: #fcfaf5; 
      --paper: #ffffff;
      --text: #333333;
      --text-2: #888888;
      --primary: #ff7b89;
      --primary-light: #ffebed;
      --border: #f0ece1;
      --radius: 16px;
      --shadow: 0 4px 15px rgba(180, 160, 140, 0.12);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      background-color: var(--bg);
      /* 便签纸纹理感背景 */
      background-image: radial-gradient(#ece6da 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      font-size: 15px; line-height: 1.5;
      padding-bottom: calc(72px + env(safe-area-inset-bottom));
    }

    #app { max-width: 720px; margin: 0 auto; padding: 16px; }
    .view { display: none; }
    .view.active { display: block; animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .page-header { padding: 8px 4px 16px; }
    .page-header h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 0.5px; color: #2c2c2c; }
    .subtitle { margin: 4px 0 0; color: var(--text-2); font-size: 13px; }

    /* 便签纸卡片 */
    .card {
      background: var(--paper);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(180, 160, 140, 0.18); }

    /* 模拟手账胶带 */
    .card-tape { position: relative; }
    .card-tape::before {
      content: ''; position: absolute; top: -10px; left: 50%; transform: translateX(-50%) rotate(-2deg);
      width: 60px; height: 20px; background: rgba(255, 218, 185, 0.6); border-radius: 2px; z-index: 1;
    }

    .section-title { margin: 0 0 12px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    
    .chips { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip {
      padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
      background: #faf8f5; color: var(--text); font-size: 14px; font-weight: 500;
      transition: all 0.2s; cursor: pointer;
    }
    .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 3px 8px rgba(255, 123, 137, 0.3); transform: scale(1.05); }

    .btn { padding: 14px 18px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; transition: all 0.2s; cursor: pointer; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(255, 123, 137, 0.3); }
    .btn-secondary { background: #f0ece1; color: #666; }
    .btn-block { display: block; width: 100%; margin: 12px 0 20px; }

    /* 天气卡片 */
    .weather-card {
      background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%);
      color: #1a3c5a; border: none; position: relative; overflow: hidden;
    }
    .weather-card::after {
      content: '☁️'; position: absolute; right: -10px; bottom: -15px; font-size: 80px; opacity: 0.2;
    }
    .weather-main { display: flex; align-items: center; justify-content: space-between; }
    .weather-temp { font-size: 46px; font-weight: 800; }
    .weather-desc { font-size: 16px; font-weight: 600; }
    .weather-meta { font-size: 13px; opacity: 0.8; margin-top: 4px; }

    /* 上传与衣柜 */
    .upload-area {
      border: 2px dashed #e0d6c8; border-radius: var(--radius); min-height: 180px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #fcfbf9; cursor: pointer; position: relative; overflow: hidden;
    }
    .upload-icon { font-size: 32px; margin-bottom: 8px; color: var(--text-2); }
    .upload-preview { width: 100%; max-height: 320px; object-fit: contain; display: block; }
    
    .closet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
    .closet-item {
      background: var(--paper); border-radius: 12px; overflow: hidden;
      box-shadow: var(--shadow); border: 1px solid var(--border); position: relative; transition: 0.2s;
    }
    .closet-item:hover { transform: rotate(-1.5deg); }
    .closet-item img { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #fafafa; }
    .closet-item-info { padding: 10px; }
    .closet-item-name { font-size: 13px; font-weight: 600; }
    .closet-item-meta { font-size: 12px; color: var(--text-2); margin-top: 4px; display: flex; align-items: center; gap: 6px; }
    .
